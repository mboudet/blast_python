<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}Blast server{% endblock %}</title>
        <script type="text/javascript" src="{{ static_url('js/jquery-1.6.1.min.js') }}"></script>
        <script type="text/javascript" src="{{ static_url('js/scheduler.js') }}"></script>
        <link href="{{ static_url('css/scheduler.css') }}" rel="stylesheet" type="text/css" media="screen" />
        {% block head %}{% endblock %}
    </head>
    <body>
        <div id="menu">
            <ul id="nav">
                {% block menu %}
                    <li><a title="Access to all your previous results" href="{{ base_url_path }}/job/history">My jobs</a></li>
                {% endblock %}
            </ul>
        </div>
        <div id="middle">
            <div id="content">
                {% block scheduler %}{% endblock %}
            </div>
        </div>
        <div id="footer">
            {% block footer %}{% endblock %}
        </div>
    </body>
</html>
